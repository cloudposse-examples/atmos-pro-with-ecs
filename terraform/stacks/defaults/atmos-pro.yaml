plan-wf-config: &plan-wf-config
  atmos-terraform-plan.yaml:
    inputs:
      component: "{{ .atmos_component }}"
      stack: "{{ .atmos_stack }}"

apply-wf-config: &apply-wf-config
  atmos-terraform-apply.yaml:
    inputs:
      component: "{{ .atmos_component }}"
      stack: "{{ .atmos_stack }}"
      github_environment: "{{ .vars.stage }}"

settings:
  pro:
    enabled: true
    drift_detection:
      enabled: true
      detect:
        workflows: *plan-wf-config
      remediate:
        workflows: *apply-wf-config
    pull_request:
      opened:
        workflows: *plan-wf-config
      synchronize:
        workflows: *plan-wf-config
      reopened:
        workflows: *plan-wf-config
      # The affected-stacks workflow uploads again after the PR merges.
      # Keep this lifecycle configured; this example uses plan/verification here
      # so queue apply remains the dev deployment gate.
      merged:
        workflows: *plan-wf-config
    merge_group:
      checks_requested:
        workflows: *apply-wf-config
    release:
      released:
        workflows: *apply-wf-config
