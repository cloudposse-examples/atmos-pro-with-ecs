name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (must already exist in ECR, e.g. 1.2.3)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
          - both
        default: both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  checks: write

env:
  ATMOS_PROFILE: github

jobs:
  promote:
    if: github.event_name == 'release'
    runs-on: ["ubuntu-latest"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Atmos
        uses: cloudposse/github-action-setup-atmos@v3
        with:
          install-wrapper: false
          atmos-version: ${{ vars.ATMOS_VERSION }}
              
      - name: Checkout
        uses: actions/checkout@v6

      - name: AWS Auth
        run: |
          atmos auth env --identity plat-dev/terraform --format=github
          atmos auth login --identity plat-dev/terraform
          
      - uses: cloudposse/github-action-docker-promote@v1
        id: promote
        with:
          organization: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          registry: ${{ vars.ECR_REGISTRY }}
          from: sha-${{ github.sha }}
          to: ${{ github.event.release.tag_name }}
          use_metadata: false

    outputs:
      image: ${{ steps.promote.outputs.image }}
      tag: ${{ steps.promote.outputs.tag }}

  affected:
    needs: [ promote ]
    name: Trigger Affected Stacks
    runs-on: ["ubuntu-latest"]
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine Affected Stacks
        env:
          ATMOS_PRO_WORKSPACE_ID: ${{ vars.ATMOS_PRO_WORKSPACE_ID }}
          ATMOS_PRO_BASE_URL: ${{ vars.ATMOS_PRO_BASE_URL }}          
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PREV=$(git describe --tags --abbrev=0 "${{ github.event.release.tag_name }}^")
          atmos describe affected --ref "refs/tags/$PREV" --upload --clone-target-ref=true
