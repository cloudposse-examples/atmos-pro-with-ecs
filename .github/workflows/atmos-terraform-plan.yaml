name: Atmos Terraform Plan
run-name: plan ${{ inputs.component }}/${{ inputs.stack }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component"
        required: true
        type: string
      stack:
        description: "Stack"
        required: true
        type: string
      # pr_number:
      #   description: "PR Number"
      #   type: string        
      sha:
        description: "Commit SHA"
        type: string

permissions:
  id-token: write
  contents: read
  checks: write
  statuses: write

env:
  ATMOS_PROFILE: github
  APP_IMAGE: "${{ vars.ECR_REGISTRY }}/${{ github.repository }}:sha-${{ inputs.sha }}"
  # PR_NUMBER: ${ inputs.pr_number }
  
jobs:
  plan:
    name: ${{ inputs.component }}-${{ inputs.stack }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cloudposse/atmos:${{ vars.ATMOS_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: Plan
        shell: bash
        env:
          ATMOS_PRO_WORKSPACE_ID: ${{ vars.ATMOS_PRO_WORKSPACE_ID }}
          ATMOS_PRO_BASE_URL: ${{ vars.ATMOS_PRO_BASE_URL }}          
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ inputs.sha }}
        run: |
          atmos terraform plan ${{ inputs.component }} -s ${{ inputs.stack }} --upload-status
